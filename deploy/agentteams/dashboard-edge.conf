# Host nginx in front of AgentTeams dashboard (Next.js trailingSlash + broken setup/status).
server {
    listen 127.0.0.1:13009;
    server_name _;
    client_max_body_size 32m;

    location = /api/agentteams/setup/status {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"ready":true,"complete":true,"status":"ready","error":null}';
    }
    location = /api/agentteams/setup/status/ {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"ready":true,"complete":true,"status":"ready","error":null}';
    }
    location = /favicon.ico {
        return 204;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:13000;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
